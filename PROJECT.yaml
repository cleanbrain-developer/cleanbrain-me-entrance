schema_version: 1

project:
  name: cleanbrain.me Entrance
  repository: cleanbrain-me-entrance
  abbreviation: entrance
  type: web-application
  lifecycle: active

purpose:
  summary: >-
    Service directory and launcher for the cleanbrain.me domain: a single
    page that lists the services running under cleanbrain.me and links out
    to each of them.
  problem: >-
    cleanbrain.me has no landing page at its root domain. A visitor has no
    way to discover which personal services exist under the domain, what
    each one does, or how to reach it.

supported_agents:
  initial:
    - codex
    - claude-code
  policy: agent-agnostic-core
  entrypoint: AGENTS.md   # sole adapter for every supported agent

principles:
  - repository-first-context
  - agent-agnostic-core
  - minimal-task-prompts
  - evidence-before-change
  - explicit-architecture-decisions
  - deterministic-quality-gates-when-implemented

current_phase:
  id: deployed-ci-driven
  status: active
  goal: >-
    https://cleanbrain.me is live in production with CI-driven deploys
    verified end to end. No remaining foundation or deployment gaps;
    ordinary feature/content work from here.

standards:
  agents_md: AGENTS.md
  spec_kit:
    pinned_version: specify-cli==1.0.8   # agent-dev-starter's pin; CLI not yet installed here, see current-state.md
    memory: .specify/memory/
  skills:
    claude_code: .claude/skills/
    codex: .agents/skills/

context:
  human_entrypoint: README.md
  agent_entrypoint: AGENTS.md
  specify_constitution: .specify/memory/constitution.md
  documentation_policy: .ai/constitution/documentation-policy.md
  product: docs/product/
  architecture: docs/architecture/
  decisions: docs/decisions/
  current_state: docs/status/current-state.md

delivery:
  implementation_present: true
  cli_present: false
  automation_present: true
