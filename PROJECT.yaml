schema_version: 1

project:
  name: cleanbrain.me Entrance
  repository: cleanbrain-me-entrance
  abbreviation: entrance
  type: web-application
  lifecycle: active

purpose:
  summary: >-
    Service directory and launcher for the cleanbrain.me domain: a single
    page that lists the services running under cleanbrain.me and links out
    to each of them.
  problem: >-
    cleanbrain.me has no landing page at its root domain. A visitor has no
    way to discover which personal services exist under the domain, what
    each one does, or how to reach it.

supported_agents:
  initial:
    - codex
    - claude-code
  policy: agent-agnostic-core

principles:
  - repository-first-context
  - agent-agnostic-core
  - minimal-task-prompts
  - evidence-before-change
  - explicit-architecture-decisions
  - deterministic-quality-gates-when-implemented

current_phase:
  id: deployed
  status: active
  goal: >-
    https://cleanbrain.me is live in production. Remaining work is enabling
    CI-driven deploys (ENABLE_PRODUCTION_DEPLOY) so future pushes to main
    roll out automatically instead of requiring a manual kubectl step.

context:
  human_entrypoint: README.md
  agent_entrypoints:
    codex: AGENTS.md
    claude_code: CLAUDE.md
  constitution: .ai/constitution/
  product: docs/product/
  architecture: docs/architecture/
  decisions: docs/decisions/
  current_state: docs/status/current-state.md

delivery:
  implementation_present: true
  cli_present: false
  automation_present: true
